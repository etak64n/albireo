# Type-checks, tests, and builds albireo on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v5

      # Installs the pnpm version that "packageManager" in package.json names.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # CI has no deployment of its own, so it checks the code with the example settings.
      - name: Use the example settings
        run: cp albireo.config.example.ts albireo.config.ts

      - run: pnpm typecheck

      - run: pnpm test

      # A deployment gets the ID of its D1 database from pnpm stack:deploy. The build
      # only checks the code, so any version 4 UUID does.
      - name: Build
        run: pnpm exec cf build
        env:
          ALBIREO_DATABASE_ID: 00000000-0000-4000-8000-000000000000
