# Records the tour of the demo that the README shows at its top, from the demo on GitHub
# Pages: the home page, a video that plays, the slides attached to it, a time in a
# comment, and a search, zooming in on the details, with the logo at its start and its
# end. Run it by hand after the screens change, then put the artifact at images/tour.gif.
name: Tour

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The logo that opens and closes the tour.
      - uses: actions/checkout@v5
        with:
          path: repo

      # Installs the pnpm version that "packageManager" in package.json names.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: repo/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Playwright goes in a package of its own next to the script of the tour, outside the
      # checkout of albireo. The tour runs in the Google Chrome of the runner, since the
      # Chromium of Playwright plays no H.264 video.
      - name: Install Playwright and ffmpeg
        run: |
          echo '{ "name": "tour", "private": true }' > package.json
          pnpm add playwright@1.65.0
          google-chrome --version
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y ffmpeg; }

      # The tour captures the frames that the browser paints, at twice the density of pixels,
      # and notes where and when to zoom. The page draws the mouse pointer, which the
      # frames would not show.
      - name: Record the tour
        env:
          DEMO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          # A word of the titles of the sample videos, which the search of the tour finds.
          TOUR_QUERY: design
        run: |
          cat > tour.mjs <<'SCRIPT'
          import { mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { chromium } from "playwright";

          const VIEW = { width: 1440, height: 900 };
          const SCALE = 2;
          const browser = await chromium.launch({ channel: "chrome" });
          const context = await browser.newContext({ viewport: VIEW, deviceScaleFactor: SCALE });
          await context.addInitScript(() => {
            addEventListener("DOMContentLoaded", () => {
              const pointer = document.createElement("div");
              pointer.style.cssText = "position:fixed;left:0;top:0;z-index:2147483647;pointer-events:none;transform:translate(-50px,-50px)";
              pointer.innerHTML =
                '<svg width="20" height="22" viewBox="0 0 20 22"><path d="M2 1v16l4.5-4.2 3 7 2.6-1.1-3-6.9H15z" fill="#1a2c44" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>';
              document.body.append(pointer);
              addEventListener("mousemove", (event) => {
                pointer.style.transform = `translate(${event.clientX - 2}px, ${event.clientY - 1}px)`;
              }, true);
            });
          });
          const page = await context.newPage();
          const client = await context.newCDPSession(page);
          // A playing video repaints the page many times a second, so each frame goes to a
          // file as it comes, and only its time stays in memory.
          mkdirSync("frames", { recursive: true });
          const frames = [];
          client.on("Page.screencastFrame", ({ data, metadata, sessionId }) => {
            const file = `frames/${String(frames.length).padStart(5, "0")}.jpg`;
            writeFileSync(file, Buffer.from(data, "base64"));
            frames.push({ file, time: metadata.timestamp });
            client.send("Page.screencastFrameAck", { sessionId }).catch(() => {});
          });

          const pause = (ms) => page.waitForTimeout(ms);
          const seconds = () => Date.now() / 1000;
          const center = (box) => ({ x: box.x + box.width / 2, y: box.y + box.height / 2 });
          const pointAt = async (locator, steps = 30) => {
            const { x, y } = center(await locator.boundingBox());
            await page.mouse.move(x, y, { steps });
          };
          const scrollTo = async (locator) => {
            await locator.evaluate((element) => element.scrollIntoView({ behavior: "smooth", block: "start" }));
            await pause(1400);
          };
          // Zooms in on a box of the viewport while the steps run, and out again after them. The
          // center is a share of the width and the height, whatever the size of the frames.
          const zooms = [];
          const zoom = async (box, factor, steps) => {
            const from = seconds();
            await steps();
            const { x, y } = center(box);
            zooms.push({ from, to: seconds(), x: x / VIEW.width, y: y / VIEW.height, factor });
          };

          // The card of the logo that opens and closes the tour, so that its start and its end
          // show when the GIF plays again and again.
          const logo = readFileSync("repo/images/albireo-wordmark.png").toString("base64");
          const sheet = await context.newPage();
          await sheet.setContent(
            `<body style="margin:0;height:100vh;display:grid;place-items:center;background:#fff">` +
              `<img src="data:image/png;base64,${logo}" style="width:460px" alt=""></body>`,
          );
          await sheet.screenshot({ path: "frames/logo.jpg", scale: "css", type: "jpeg", quality: 92 });
          await sheet.close();

          await page.goto(process.env.DEMO_URL);
          await page.getByRole("heading", { name: "Home", level: 1 }).waitFor();
          await page.waitForLoadState("networkidle");
          await pause(1000);
          await client.send("Page.startScreencast", {
            format: "jpeg",
            quality: 92,
            maxWidth: VIEW.width * SCALE,
            maxHeight: VIEW.height * SCALE,
            everyNthFrame: 1,
          });
          await page.mouse.move(760, 520);
          await pause(1500);

          // The video recommended first on the home page, and the way to play it.
          const feature = page.locator("main a").filter({ has: page.locator("h2") }).first();
          const play = feature.getByText("Play", { exact: true });
          await zoom(await feature.boundingBox(), 1.3, async () => {
            await pointAt(play);
            await pause(2000);
          });
          await play.click();

          // The video plays in the player of its page.
          const video = page.locator("video").first();
          await video.waitFor({ state: "attached" });
          await page.waitForLoadState("networkidle");
          await pause(1000);
          const stage = await video.boundingBox();
          await zoom(stage, 1.25, async () => {
            await page.mouse.move(stage.x + stage.width / 2, stage.y + stage.height / 2, { steps: 30 });
            await pause(500);
            const start = page.getByRole("button", { name: "Play", exact: true }).first();
            if (await start.isVisible()) {
              await pointAt(start, 20);
              await start.click();
            } else {
              await page.mouse.click(stage.x + stage.width / 2, stage.y + stage.height / 2);
            }
            await page
              .waitForFunction(() => document.querySelector("video")?.paused === false, null, { timeout: 5000 })
              .catch(() => video.evaluate((element) => element.play()));
            await page.mouse.move(stage.x + stage.width * 0.66, stage.y + stage.height * 0.36, { steps: 20 });
            await pause(4000);
          });

          // The slides attached to the video, in the preview over the page.
          await page.mouse.move(1340, 520, { steps: 15 });
          await scrollTo(page.getByRole("heading", { name: "Attachments" }));
          const preview = page.getByRole("button", { name: "Preview" }).first();
          await pointAt(preview);
          await pause(400);
          await preview.click();
          await page.getByRole("dialog").locator("canvas").first().waitFor();
          await pause(3600);
          await page.keyboard.press("Escape");
          await pause(800);

          // A time in a comment, which plays the video from there.
          await scrollTo(page.getByRole("heading", { name: "Comments" }));
          const time = page.locator("li button").filter({ hasText: /^\d{1,2}:\d{2}$/ }).first();
          const mark = await time.boundingBox();
          await pointAt(time);
          await zoom({ x: mark.x - 80, y: mark.y - 40, width: 560, height: 110 }, 1.8, () => pause(2400));
          await time.click();
          await pause(3400);

          // A search from the header, and the videos that it finds.
          const search = page.getByRole("textbox", { name: "Search videos" });
          await pointAt(search);
          await search.click();
          await page.keyboard.type(process.env.TOUR_QUERY, { delay: 120 });
          await page.keyboard.press("Enter");
          // The title of the video holds the word too, so wait for the heading of the results.
          const results = page.getByRole("heading", { level: 1, name: `Results for “${process.env.TOUR_QUERY}”` });
          await results.waitFor();
          await page.waitForLoadState("networkidle");
          await page.mouse.move(1340, 600, { steps: 15 });
          await pause(800);
          const heading = await results.boundingBox();
          const main = await page.locator("main").boundingBox();
          await zoom({ x: main.x, y: heading.y - 20, width: main.width, height: 560 }, 1.3, () => pause(3200));
          await pause(1200);

          // The browser sends a frame only when the page changes, so the last frame lasts until here.
          const stopped = seconds();
          await client.send("Page.stopScreencast");
          await context.close();
          await browser.close();

          // The frames, each shown until the next one, between the cards, and the zooms on the
          // same clock. The concat demuxer keeps the duration of the last file only when the file
          // comes again after it.
          const OPENING = 1.5;
          const CLOSING = 1.5;
          const start = frames[0].time - OPENING;
          const lines = ["ffconcat version 1.0", "file 'frames/logo.jpg'", `duration ${OPENING}`];
          frames.forEach((frame, index) => {
            const next = frames[index + 1];
            const until = next === undefined ? Math.max(stopped, frame.time + 0.1) : next.time;
            lines.push(`file '${frame.file}'`, `duration ${Math.max(0.001, until - frame.time).toFixed(3)}`);
          });
          lines.push("file 'frames/logo.jpg'", `duration ${CLOSING}`, "file 'frames/logo.jpg'");
          writeFileSync("tour.ffconcat", lines.join("\n") + "\n");

          // zoompan reads the time from the number of the output frame, at FPS frames a second.
          const FPS = 8;
          const RAMP = 0.6;
          const t = `(on/${FPS})`;
          const windows = zooms.map((zoom) => ({ ...zoom, from: zoom.from - start, to: zoom.to - start }));
          const factor = windows
            .map((w) => `${w.factor - 1}*clip(min((${t}-${w.from.toFixed(2)})/${RAMP},(${w.to.toFixed(2)}-${t})/${RAMP}),0,1)`)
            .join("+");
          const pick = (key, side) =>
            windows.reduceRight((rest, w) => `if(between(${t},${w.from.toFixed(2)},${w.to.toFixed(2)}),${side}*${w[key].toFixed(4)},${rest})`, `${side}/2`);
          // Fewer frames and colors keep the GIF small, at a quality that still reads well.
          const filter = [
            `fps=${FPS}`,
            `zoompan=z='1+${factor}':x='clip(${pick("x", "iw")}-iw/zoom/2,0,iw-iw/zoom)':y='clip(${pick("y", "ih")}-ih/zoom/2,0,ih-ih/zoom)':d=1:s=1120x700:fps=${FPS}`,
            "split[a][b];[a]palettegen=max_colors=96:stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=5:diff_mode=rectangle",
          ].join(",");
          writeFileSync("filter.txt", filter);
          const total = Math.max(stopped, frames.at(-1).time + 0.1) - start + CLOSING;
          writeFileSync("previews.txt", [1, ...windows.map((w) => (w.from + w.to) / 2), total - 1].map((time) => time.toFixed(2)).join("\n") + "\n");
          // The size of a JPEG frame, from its start-of-frame segment.
          const sizeOf = (jpeg) => {
            for (let at = 2; at < jpeg.length; at += 2 + jpeg.readUInt16BE(at + 2)) {
              if (jpeg[at + 1] >= 0xc0 && jpeg[at + 1] <= 0xc2) return `${jpeg.readUInt16BE(at + 7)}x${jpeg.readUInt16BE(at + 5)}`;
            }
            return "unknown";
          };
          console.log(`${frames.length} frames of ${sizeOf(readFileSync(frames[0].file))} over ${(frames.at(-1).time - start).toFixed(1)} s, ${zooms.length} zooms`);
          SCRIPT
          node tour.mjs

      - name: Make the GIF
        run: ffmpeg -y -loglevel error -f concat -safe 0 -i tour.ffconcat -filter_complex "$(cat filter.txt)" tour.gif && ls -la tour.gif

      # Still frames of the start and of the middle of each zoom, to check the tour without
      # playing the GIF.
      - name: Make the previews
        run: |
          mapfile -t times < previews.txt
          for index in "${!times[@]}"; do
            ffmpeg -nostdin -y -loglevel error -ss "${times[$index]}" -i tour.gif -frames:v 1 "preview-$((index + 1)).png"
          done
          ls -la preview-*.png

      - uses: actions/upload-artifact@v5
        with:
          name: tour
          path: |
            tour.gif
            preview-*.png
          if-no-files-found: error
