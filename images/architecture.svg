<title id="title">Architecture of albireo</title>
<desc id="desc">A browser signs in through Cloudflare Access to the albireo Worker in your Cloudflare account. The Worker asks Access for its keys, to check the token of the sign-in, and for the person who signed in. It serves the browser app, keeps the library in D1, and signs its requests to an S3-compatible bucket with an access key that it keeps as a secret. The browser uploads, plays, and reads the files in the bucket directly, with presigned URLs. pnpm stack:deploy on your machine creates the D1 database, the Access application, and the Worker, and puts the access key in the Worker.</desc>
