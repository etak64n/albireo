<text x="516" y="242" font-size="14" fill="#1a2c44" font-weight="600">API (/api/*)</text>
<text x="516" y="262" font-size="12" fill="#3c4f69">checks the token from Access,</text>
<text x="516" y="279" font-size="12" fill="#3c4f69">and signs the URLs of the files</text>
