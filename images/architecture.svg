<text x="240" y="302" font-size="12" fill="#667691">the keys and who signed in</text>
<path d="M112 262 V492 H928 V310" fill="none" stroke="#667691" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="316" y="486" font-size="12" fill="#3c4f69">presigned URLs: the browser uploads, plays, and reads the files directly</text>
<rect x="32" y="548" width="222" height="62" rx="8" fill="#ffffff" stroke="#d4dee9" />
<g transform="translate(46 560) scale(0.8333)" color="#3c4f69" fill="none" stroke="#3c4f69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5a2 2 0 0 1 2 2v8.526a2 2 0 0 0 .212.897l1.068 2.127a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45l1.068-2.127A2 2 0 0 0 4 15.526V7a2 2 0 0 1 2-2z"/><path d="M20.054 15.987H3.946"/></g>
<text x="74" y="575" font-size="14" fill="#1a2c44" font-weight="600">Your machine</text>
<text x="46" y="598" font-size="12" fill="#3c4f69" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">pnpm stack:deploy</text>
<path d="M254 579 H300 V464" fill="none" stroke="#667691" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<g transform="translate(314 542) scale(0.6667)" color="#667691" fill="none" stroke="#667691" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></g>
<text x="336" y="554" font-size="12" fill="#3c4f69">creates or updates the D1 database, the Access application, and the Worker,</text>
<text x="336" y="572" font-size="12" fill="#3c4f69">puts the access key of the bucket in the Worker as a secret,</text>
<text x="336" y="590" font-size="12" fill="#3c4f69">and tags them as one stack (Resource Tagging)</text>
</svg>
