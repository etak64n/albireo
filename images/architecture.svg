<text x="870" y="258" font-size="12" fill="#3c4f69" text-anchor="middle">videos, thumbnails,</text>
<text x="870" y="274" font-size="12" fill="#3c4f69" text-anchor="middle">pictures, and</text>
<text x="870" y="290" font-size="12" fill="#3c4f69" text-anchor="middle">attachments</text>
