[package]
name = "albireo"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "A private video library, with its videos in S3-compatible storage"
publish = false

[dependencies]
argon2 = "0.6"
async-trait = "0.1"
axum = "0.8.9"
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
rusty-s3 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "chrono", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "time", "net", "fs"] }
tower-http = { version = "0.7", features = ["compression-gzip", "compression-br"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"

# A password hash takes seconds without optimizations, and the tests make many of them.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
